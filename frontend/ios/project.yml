# Fallback: regenerate CampusGuard.xcodeproj with XcodeGen (brew install xcodegen && xcodegen)
# if the checked-in project ever gets out of sync.
name: CampusGuard
options:
  bundleIdPrefix: com.campusguard
  deploymentTarget:
    iOS: "18.0"
packages:
  CampusGuardKit:
    path: Packages/CampusGuardKit
targets:
  CampusGuard:
    type: application
    platform: iOS
    sources: [CampusGuard]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: CampusGuardKit
        product: TagKit
      - package: CampusGuardKit
        product: CampusGuardUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.campusguard.app
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CampusGuard.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Campus Guard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  CampusGuard:
    build:
      targets:
        CampusGuard: all
    test:
      targets:
        - package: CampusGuardKit/TagKitTests
