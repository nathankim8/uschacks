name: Backend Supabase

on:
  push:
    branches: ['be/**']
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Start isolated Supabase with migrations
        run: npx supabase start
      - name: Save local credentials without printing them
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/campus-guard-status.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/campus-guard-status.json`, 'utf8'));
          const env = { SUPABASE_URL: status.API_URL, SUPABASE_PUBLISHABLE_KEY: status.ANON_KEY, SUPABASE_SECRET_KEY: status.SERVICE_ROLE_KEY };
          for (const [key, value] of Object.entries(env)) {
            if (!value) throw new Error(`Missing local credential: ${key}`);
            if (key !== 'SUPABASE_URL') console.log(`::add-mask::${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          fs.unlinkSync(`${process.env.RUNNER_TEMP}/campus-guard-status.json`);
          NODE
      - name: Serve Edge Function and wait for authenticated boundary
        run: |
          npx supabase functions serve campus-guard > "$RUNNER_TEMP/campus-guard-edge.log" 2>&1 &
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          let consecutiveReady = 0;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(`${process.env.SUPABASE_URL}/functions/v1/campus-guard/sightings`, {
                headers: { apikey: process.env.SUPABASE_PUBLISHABLE_KEY },
                signal: AbortSignal.timeout(3000),
              });
              const body = await response.json();
              // Kong can return401 before the function is running. Require the
              // handler's own response, and allow functions serve to finish restart.
              consecutiveReady = response.status === 401 && body.error?.code === 'unauthorized'
                ? consecutiveReady + 1 : 0;
              if (consecutiveReady >= 3) process.exit(0);
            } catch { consecutiveReady = 0; }
            await setTimeout(2000);
          }
          throw new Error('Edge Function did not become ready.');
          NODE
      - name: Verify actual Auth, Edge Function, database and owner isolation
        run: npm run test:integration
      - name: Database security and retention tests
        run: npx supabase test db
      - name: Function startup diagnostics on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/campus-guard-edge.log" || true
      - name: Stop isolated services
        if: always()
        run: npx supabase stop --no-backup
